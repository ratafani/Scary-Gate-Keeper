services:
  game:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      LLM_NAME: ${LLM_NAME:-swiss-ai/Apertus-v1.5-70B}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.inference.cscs.ch/v1}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in track_2b/.env or your environment}
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
